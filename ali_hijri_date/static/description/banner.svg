<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="80" r="40" fill="#875A7B" opacity="0.08"/>
  <circle cx="700" cy="320" r="60" fill="#875A7B" opacity="0.08"/>
  <circle cx="660" cy="95" r="25" fill="#875A7B" opacity="0.06"/>
  <circle cx="150" cy="350" r="35" fill="#875A7B" opacity="0.06"/>

  <!-- Hijri calendar + crescent emblem -->
  <g transform="translate(400, 120)">
    <!-- calendar body -->
    <rect x="-48" y="-42" width="96" height="90" rx="11" fill="none" stroke="#875A7B" stroke-width="5"/>
    <!-- header band -->
    <line x1="-48" y1="-22" x2="48" y2="-22" stroke="#875A7B" stroke-width="5"/>
    <!-- binding rings -->
    <line x1="-22" y1="-54" x2="-22" y2="-38" stroke="#875A7B" stroke-width="5" stroke-linecap="round"/>
    <line x1="22" y1="-54" x2="22" y2="-38" stroke="#875A7B" stroke-width="5" stroke-linecap="round"/>
    <!-- crescent -->
    <g transform="translate(0,15)">
      <circle cx="0" cy="0" r="20" fill="#875A7B"/>
      <circle cx="8" cy="-3" r="16" fill="#f3f1f4"/>
    </g>
    <!-- star -->
    <path d="M30 0 l2.6 5.6 6.1 0.7 -4.5 4.1 1.2 6 -5.4 -3 -5.4 3 1.2 -6 -4.5 -4.1 6.1 -0.7 z" fill="#875A7B"/>
  </g>

  <!-- Title -->
  <text x="400" y="240" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#875A7B" text-anchor="middle">Hijri Date Widget</text>

  <!-- Subtitle -->
  <text x="400" y="290" font-family="Arial, sans-serif" font-size="24" fill="#6c757d" text-anchor="middle">Umm al-Qura &amp; Gregorian dates, side by side</text>
</svg>
